version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vinapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - vinnet

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/vinapp
      - NODE_ENV=development
    depends_on:
      - db
    networks:
      - vinnet

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    networks:
      - vinnet

volumes:
  db_data:

networks:
  vinnet:
    driver: bridge
