<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Merca Mono</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem('tiagpos-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="market-body">
  <div class="container">
    <header class="header market-topbar">
      <div class="logo"><div class="brand">WhatsMenú</div></div>
      <div class="market-topbar-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Cambiar tema">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" id="cartFab" class="market-cart-fab" aria-label="Abrir carrito">
          <span class="market-cart-fab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/>
              <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.5L21 8H7"/>
            </svg>
          </span>
          <span class="market-cart-fab-label">Carrito</span>
          <span id="cartBadge" class="market-cart-fab-badge" hidden>0</span>
        </button>
      </div>
    </header>

    <main>
      <div id="bizBanner" class="biz-banner is-placeholder" aria-hidden="true">
        <img id="bizBannerImg" alt="" />
      </div>

      <div id="bizHeader" class="biz-header">
        <img id="bizLogo" class="biz-logo" src="" alt="logo" />
        <div class="biz-header-copy">
          <div class="biz-title-row">
            <h1 id="bizName">Merca Mono</h1>
            <span id="bizOpenBadge" class="biz-status" style="display:none"></span>
          </div>
          <div id="bizAddress" class="small biz-address" style="display:none"></div>
          <div id="bizPhone" class="small biz-phone" style="display:none"></div>
          <div id="bizEmail" class="small biz-email" style="display:none"></div>
          <div id="bizDesc" class="small" style="color:var(--muted);margin-top:4px">Mini supermercado · pide por WhatsApp</div>
        </div>
      </div>

      <div id="closedBanner" class="card" style="display:none;margin-bottom:12px;border-color:var(--accent-hot)">
        <strong>Negocio no disponible</strong>
        <p class="small" style="margin:6px 0 0">Este negocio no está recibiendo pedidos ahora.</p>
      </div>

      <div class="market-layout">
        <div class="card market-catalog">
          <div class="market-toolbar">
            <h3 style="margin:0">Productos</h3>
            <input id="marketSearch" type="search" placeholder="Buscar producto..." />
          </div>
          <div id="catTabs" class="market-cats" role="tablist"></div>
          <div id="menuList" class="market-grid">Cargando...</div>
        </div>
      </div>
    </main>
  </div>

  <div id="cartModalOverlay" class="modal-overlay" style="display:none">
    <div class="modal market-cart-modal" role="dialog" aria-modal="true" aria-labelledby="cartModalTitle">
      <div class="order-detail-head">
        <div>
          <h3 id="cartModalTitle">Confirmar pedido</h3>
          <p class="small" style="margin:4px 0 0;color:var(--muted)">Revisa tu carrito y envía el pedido por WhatsApp</p>
        </div>
        <button type="button" id="cartModalCloseX" class="market-cart-close" aria-label="Cerrar">×</button>
      </div>
      <div id="cartItems" class="market-cart-body">No hay items en el carrito</div>
      <div id="checkoutFields" style="display:none;margin-top:12px">
        <label class="login-field" for="custName">
          <span>Tu nombre</span>
          <input id="custName" placeholder="Nombre" autocomplete="name" />
        </label>
        <label class="login-field" for="custPhone" style="margin-top:10px">
          <span>Tu WhatsApp (opcional)</span>
          <input id="custPhone" placeholder="Ej. 3001234567" inputmode="tel" autocomplete="tel" />
        </label>
        <label class="login-field" for="payMethod" style="margin-top:10px">
          <span>Método de pago</span>
          <select id="payMethod">
            <option value="efectivo">Efectivo</option>
            <option value="transferencia">Transferencia</option>
          </select>
        </label>
      </div>
      <div class="market-cart-footer">
        <div id="cartTotal" class="market-cart-total"></div>
        <div id="orderMsg" class="small inline-msg" style="display:none;margin-top:8px"></div>
        <div class="modal-actions" style="margin-top:12px">
          <button id="cartModalClose" class="btn btn-ghost" type="button">Seguir comprando</button>
          <button id="waBtn" class="btn btn-primary" style="display:none" type="button">Enviar pedido por WhatsApp</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtMoney(n){ return '$' + Number(n).toLocaleString('es-CO'); }
    function normalizeWaPhone(raw){
      if(!raw) return '';
      let d = String(raw).replace(/\D/g, '');
      if(!d) return '';
      if(d.startsWith('00')) d = d.slice(2);
      if(d.length === 10 && d.startsWith('3')) d = '57' + d;
      return d;
    }
    function openWhatsAppToStore(phoneRaw, message){
      const phone = normalizeWaPhone(phoneRaw);
      if(!phone) throw new Error('La tienda no tiene WhatsApp configurado.');
      const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(message);
      const w = window.open(url, '_blank');
      if(!w) window.location.href = url;
      return url;
    }

    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const slug = (pathParts.length >= 2 && pathParts[0] === 'b') ? pathParts[1] : pathParts[0] || '';

    let BUSINESS = null;
    let MENU = [];
    let CART = [];
    let SENDING = false;
    let IS_OPEN = true;
    let ACTIVE_CAT = 'all';

    function businessIsOpen(b){
      if(!b) return true;
      return typeof b.is_open === 'undefined' ? true : !!b.is_open;
    }

    function categories(){
      const fromBiz = (BUSINESS && Array.isArray(BUSINESS.categories)) ? BUSINESS.categories.filter(Boolean) : [];
      const fromMenu = [];
      MENU.forEach(m => { if(m.category && !fromMenu.includes(m.category)) fromMenu.push(m.category); });
      const merged = fromBiz.length ? fromBiz.slice() : fromMenu.slice();
      fromMenu.forEach(c => { if(!merged.includes(c)) merged.push(c); });
      return merged;
    }

    async function loadBusiness(){
      try{
        const res = await fetch('/api/b/' + encodeURIComponent(slug));
        if(!res.ok){ document.getElementById('menuList').innerText = 'Negocio no encontrado'; return }
        const data = await res.json();
        BUSINESS = data.business || {};
        IS_OPEN = businessIsOpen(BUSINESS);
        document.title = (BUSINESS.name || 'Mercado') + ' — WhatsMenú';
        document.getElementById('bizName').textContent = BUSINESS.name || data.username || 'Mercado';
        document.getElementById('bizDesc').textContent = BUSINESS.store_kind === 'market'
          ? 'Mini supermercado · pide por WhatsApp'
          : 'Pide por WhatsApp';

        const logoEl = document.getElementById('bizLogo');
        if(BUSINESS.logo){ logoEl.src = BUSINESS.logo; logoEl.classList.add('is-visible'); }
        else { logoEl.removeAttribute('src'); logoEl.classList.remove('is-visible'); }

        const bannerWrap = document.getElementById('bizBanner');
        const bannerImg = document.getElementById('bizBannerImg');
        if(BUSINESS.banner){
          bannerImg.src = BUSINESS.banner;
          bannerWrap.classList.add('has-image');
          bannerWrap.classList.remove('is-placeholder');
        } else {
          bannerImg.removeAttribute('src');
          bannerWrap.classList.remove('has-image');
          bannerWrap.classList.add('is-placeholder');
        }

        const badge = document.getElementById('bizOpenBadge');
        badge.style.display = 'inline-flex';
        if(IS_OPEN){ badge.textContent = 'Disponible'; badge.className = 'biz-status biz-status-open'; }
        else { badge.textContent = 'No disponible'; badge.className = 'biz-status biz-status-closed'; }

        const addr = document.getElementById('bizAddress');
        if(BUSINESS.address){ addr.style.display = 'block'; addr.textContent = '📍 ' + BUSINESS.address; }
        else { addr.style.display = 'none'; addr.textContent = ''; }

        document.getElementById('closedBanner').style.display = IS_OPEN ? 'none' : 'block';

        const phoneEl = document.getElementById('bizPhone');
        phoneEl.textContent = '';
        if(BUSINESS.phone){
          const raw = String(BUSINESS.phone).trim();
          const digits = raw.replace(/\D/g, '');
          const a = document.createElement('a');
          a.href = digits ? ('tel:+' + (digits.startsWith('57') ? digits : ('57' + digits))) : '#';
          a.textContent = '📞 ' + raw;
          phoneEl.appendChild(a);
          phoneEl.style.display = 'block';
        } else {
          phoneEl.style.display = 'none';
        }

        const emailEl = document.getElementById('bizEmail');
        emailEl.textContent = '';
        if(BUSINESS.email){
          const a = document.createElement('a');
          a.href = 'mailto:' + BUSINESS.email;
          a.textContent = '✉ ' + BUSINESS.email;
          emailEl.appendChild(a);
          emailEl.style.display = 'block';
        } else {
          emailEl.style.display = 'none';
        }

        loadMenu();
      }catch(e){ document.getElementById('menuList').innerText = 'Error cargando negocio'; }
    }

    async function loadMenu(){
      try{
        const res = await fetch('/api/menu?ownerSlug=' + encodeURIComponent(slug));
        if(!res.ok){ document.getElementById('menuList').innerText = 'Error cargando productos'; return }
        MENU = (await res.json()).filter(m => m.available !== false);
        renderCats();
        renderMenu();
        renderCart();
      }catch(e){ document.getElementById('menuList').innerText = 'Error cargando productos'; }
    }

    function renderCats(){
      const cats = categories();
      const el = document.getElementById('catTabs');
      const tabs = [{ id: 'all', label: 'Todos' }].concat(cats.map(c => ({ id: c, label: c })));
      el.innerHTML = tabs.map(t =>
        `<button type="button" class="market-cat${ACTIVE_CAT===t.id?' is-active':''}" data-cat="${esc(t.id)}">${esc(t.label)}</button>`
      ).join('');
      el.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', ()=>{
        ACTIVE_CAT = b.getAttribute('data-cat');
        renderCats();
        renderMenu();
      }));
    }

    function filteredMenu(){
      const q = (document.getElementById('marketSearch').value || '').trim().toLowerCase();
      return MENU.filter(m => {
        if(ACTIVE_CAT !== 'all' && (m.category || '') !== ACTIVE_CAT) return false;
        if(!q) return true;
        return (m.name || '').toLowerCase().includes(q) || (m.description || '').toLowerCase().includes(q);
      });
    }

    function stockLabel(m){
      if(typeof m.stock !== 'number') return '';
      return m.stock + (m.unit ? ' ' + m.unit : '') + ' disp.';
    }

    function renderMenu(){
      const el = document.getElementById('menuList');
      const list = filteredMenu();
      if(!MENU.length){
        el.innerHTML = '<div class="small">Aún no hay productos. El negocio puede agregarlos desde el panel.</div>';
        return;
      }
      if(!list.length){
        el.innerHTML = '<div class="small">No hay productos en esta categoría.</div>';
        return;
      }
      el.innerHTML = list.map(m => {
        const max = typeof m.stock === 'number' ? Math.max(1, m.stock) : 99;
        const out = typeof m.stock === 'number' && m.stock <= 0;
        return `<article class="market-card" data-id="${Number(m.id)}">
          <div class="market-card-top">
            <strong>${esc(m.name)}</strong>
            ${m.category ? `<span class="market-chip">${esc(m.category)}</span>` : ''}
          </div>
          ${m.description ? `<p class="small market-desc">${esc(m.description)}</p>` : ''}
          <div class="market-card-meta">
            <div class="menu-price">${fmtMoney(m.price)}${m.unit ? ' <span class="small">/ '+esc(m.unit)+'</span>' : ''}</div>
            <div class="small">${esc(stockLabel(m))}</div>
          </div>
          <div class="market-qty-row">
            <label class="small">Cantidad
              <input type="number" class="qty-input" min="1" max="${max}" value="1" ${(!IS_OPEN||out)?'disabled':''} />
            </label>
            ${IS_OPEN && !out
              ? `<button class="add-btn" type="button" data-id="${Number(m.id)}">Agregar</button>`
              : `<button class="add-btn" type="button" disabled style="opacity:.5">${out?'Sin stock':'Cerrado'}</button>`}
          </div>
        </article>`;
      }).join('');

      el.querySelectorAll('.add-btn[data-id]').forEach(b => b.addEventListener('click', ()=>{
        const id = Number(b.getAttribute('data-id'));
        const item = MENU.find(x => x.id === id);
        if(!item) return;
        const card = b.closest('.market-card');
        const input = card && card.querySelector('.qty-input');
        let qty = Math.max(1, Number(input && input.value || 1));
        if(typeof item.stock === 'number') qty = Math.min(qty, item.stock);
        const existing = CART.find(c => c.id === id);
        const nextQty = (existing ? existing.qty : 0) + qty;
        if(typeof item.stock === 'number' && nextQty > item.stock){
          alert('Solo hay ' + item.stock + ' disponibles de ' + item.name);
          return;
        }
        if(existing) existing.qty = nextQty;
        else CART.push({ id: item.id, name: item.name, price: item.price, qty });
        renderCart();
      }));
    }

    function cartCount(){
      return CART.reduce((s,c)=> s + (c.qty || 0), 0);
    }

    function updateCartBadge(){
      const badge = document.getElementById('cartBadge');
      const fab = document.getElementById('cartFab');
      const n = cartCount();
      if(!badge || !fab) return;
      if(n > 0){
        badge.hidden = false;
        badge.textContent = String(n);
        fab.classList.add('has-items');
      } else {
        badge.hidden = true;
        badge.textContent = '0';
        fab.classList.remove('has-items');
      }
    }

    function openCartModal(){
      const ov = document.getElementById('cartModalOverlay');
      if(ov) ov.style.display = 'flex';
      renderCart();
    }

    function closeCartModal(){
      const ov = document.getElementById('cartModalOverlay');
      if(ov) ov.style.display = 'none';
    }

    function renderCart(){
      const el = document.getElementById('cartItems');
      const fields = document.getElementById('checkoutFields');
      const wa = document.getElementById('waBtn');
      updateCartBadge();
      if(!IS_OPEN){
        el.innerHTML = '<div class="small">El negocio no está disponible para pedidos.</div>';
        document.getElementById('cartTotal').innerText = '';
        wa.style.display='none'; fields.style.display='none';
        return;
      }
      if(!CART.length){
        el.innerHTML = '<div class="small">No hay items en el carrito</div>';
        document.getElementById('cartTotal').innerText = '';
        wa.style.display='none'; fields.style.display='none';
        return;
      }
      el.innerHTML = '<ul class="market-cart-list">' + CART.map(c =>
        `<li><span>${esc(c.name)} × ${esc(c.qty)}</span><span>${fmtMoney(c.price * c.qty)}
          <button data-id="${Number(c.id)}" class="btn btn-ghost" type="button" style="margin-left:6px" aria-label="Quitar">−</button></span></li>`
      ).join('') + '</ul>';
      el.querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', ()=>{
        const id = Number(b.getAttribute('data-id'));
        const idx = CART.findIndex(x => x.id === id);
        if(idx === -1) return;
        CART[idx].qty -= 1;
        if(CART[idx].qty <= 0) CART.splice(idx, 1);
        renderCart();
      }));
      const total = CART.reduce((s,i)=> s + i.qty * i.price, 0);
      document.getElementById('cartTotal').innerText = 'Total: ' + fmtMoney(total);
      fields.style.display='block';
      wa.style.display='inline-flex';
      wa.disabled = SENDING;
      wa.textContent = SENDING ? 'Enviando...' : 'Enviar pedido por WhatsApp';
    }

    async function resolveStorePhone(){
      let phone = BUSINESS && BUSINESS.phone;
      if(!normalizeWaPhone(phone)){
        try{
          const cfg = await fetch('/api/config').then(r => r.json());
          phone = cfg.whatsapp_number;
        }catch(e){}
      }
      return phone;
    }

    function buildStoreMessage(order, customer, customerPhone, items){
      const bizName = (BUSINESS && BUSINESS.name) || slug || 'tienda';
      const payLabel = order.payment_method === 'transferencia' ? 'Transferencia' : (order.payment_method === 'efectivo' ? 'Efectivo' : '');
      return [
        '🛒 *Nuevo pedido — ' + bizName + '*',
        '',
        'Cliente: ' + customer,
        customerPhone ? ('WhatsApp cliente: ' + customerPhone) : null,
        payLabel ? ('Método de pago: ' + payLabel) : null,
        '',
        '*Detalle:*',
        ...items.map(c => '• ' + c.name + ' x' + c.qty + ' — ' + fmtMoney(c.price * c.qty)),
        '',
        '*Total: ' + fmtMoney(order.total) + '*',
        'Pedido #' + order.id,
        order.checkout_url ? ('Pagar / comprobante: ' + order.checkout_url) : null
      ].filter(Boolean).join('\n');
    }

    async function sendOrderToStoreWhatsApp(){
      const msgEl = document.getElementById('orderMsg');
      const wa = document.getElementById('waBtn');
      msgEl.style.display='none';
      const customer = (document.getElementById('custName').value || '').trim() || 'Cliente';
      const customerPhone = (document.getElementById('custPhone').value || '').trim();
      const paymentMethod = (document.getElementById('payMethod') || {}).value || 'efectivo';
      if(!CART.length){
        msgEl.textContent = 'Agrega productos al carrito primero';
        msgEl.className='small inline-msg error'; msgEl.style.display='block';
        return;
      }
      let storePhone;
      try{
        storePhone = await resolveStorePhone();
        if(!normalizeWaPhone(storePhone)) throw new Error('sin teléfono');
      }catch(e){
        msgEl.textContent = 'La tienda no tiene WhatsApp configurado.';
        msgEl.className='small inline-msg error'; msgEl.style.display='block';
        return;
      }
      const items = CART.map(c => ({ id: c.id, name: c.name, price: c.price, qty: c.qty }));
      SENDING = true; wa.disabled = true; wa.textContent = 'Enviando...';
      try{
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: {'content-type':'application/json'},
          body: JSON.stringify({
            customer_name: customer,
            customer_phone: customerPhone || null,
            payment_method: paymentMethod,
            items,
            ownerSlug: slug
          })
        });
        if(!res.ok){
          const t = await res.json().catch(()=>({}));
          throw new Error(t.error || res.statusText);
        }
        const order = await res.json();
        openWhatsAppToStore(storePhone, buildStoreMessage(order, customer, customerPhone, items));
        msgEl.textContent = 'Pedido #' + order.id + ' creado. Se abrió WhatsApp.';
        msgEl.className='small inline-msg success'; msgEl.style.display='block';
        CART = [];
        document.getElementById('custName').value = '';
        document.getElementById('custPhone').value = '';
        const payEl = document.getElementById('payMethod'); if(payEl) payEl.value = 'efectivo';
        await loadMenu();
      }catch(e){
        msgEl.textContent = 'No se pudo enviar: ' + e.message;
        msgEl.className='small inline-msg error'; msgEl.style.display='block';
      }finally{
        SENDING = false;
        renderCart();
      }
    }

    document.getElementById('marketSearch').addEventListener('input', renderMenu);
    document.getElementById('cartFab').addEventListener('click', openCartModal);
    document.getElementById('cartModalClose').addEventListener('click', closeCartModal);
    document.getElementById('cartModalCloseX').addEventListener('click', closeCartModal);
    document.getElementById('cartModalOverlay').addEventListener('click', (e)=>{
      if(e.target && e.target.id === 'cartModalOverlay') closeCartModal();
    });
    document.getElementById('waBtn').addEventListener('click', ()=> sendOrderToStoreWhatsApp());
    window.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape') closeCartModal();
    });
    if(!slug) document.getElementById('menuList').innerText = 'Negocio no especificado';
    else loadBusiness();
  </script>
  <script src="/theme.js"></script>
</body>
</html>
