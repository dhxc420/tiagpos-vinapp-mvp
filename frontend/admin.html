<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Gestor de Pedidos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wrap">
    <header>
          <h1>tiagPOS — Panel Admin</h1>
      <div><a href="/" style="text-decoration:none">← Volver al sitio</a></div>
    </header>

    <!-- New admin layout with sidebar -->
    <div class="admin-layout" style="display:flex;gap:18px;margin-top:18px">
      <aside id="sidebar" class="card" style="width:240px;padding:14px;flex-shrink:0">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <img id="sidebarLogo" src="" alt="logo" style="width:38px;height:38px;border-radius:8px;object-fit:cover;display:none;border:1px solid rgba(0,0,0,0.06)" />
          <div>
            <div id="sidebarBizName" style="font-weight:800;color:var(--accent)"></div>
            <div id="sidebarBizRole" class="small" style="color:var(--muted)">Negocio</div>
              <div style="margin-top:6px"><a id="publicLink" href="#" target="_blank" class="small" style="color:var(--muted);text-decoration:none">Ver página pública</a></div>
            </div>
        </div>
        <nav id="sidebarNav">
          <ul style="list-style:none;padding:0;margin:0">
            <li><a href="#" data-section="dashboard" class="side-link">🏠 Dashboard</a></li>
            <li><a href="#" data-section="orders" class="side-link">🧾 Pedidos</a></li>
            <li><a href="#" data-section="inventory" class="side-link">📦 Inventario</a></li>
            <li><a href="#" data-section="menu" class="side-link">🍽️ Menú</a></li>
            <li><a href="#" data-section="cash" class="side-link">💵 Caja</a></li>
            <li><a href="#" data-section="profile" class="side-link">⚙️ Perfil / Negocio</a></li>
            <li><a href="#" id="sidebarLogout" class="side-link" style="color:#b91c1c">🚪 Cerrar sesión</a></li>
          </ul>
        </nav>
      </aside>

      <main id="mainContent" style="flex:1;">
        <div class="card" id="controls">
          <div id="authArea" style="display:flex;gap:12px;align-items:center">
            <div id="loginForm">
              <input id="loginUser" placeholder="Usuario" style="padding:8px;border-radius:6px;border:1px solid #ddd;margin-right:8px" />
              <input id="loginPass" placeholder="Contraseña" type="password" style="padding:8px;border-radius:6px;border:1px solid #ddd;margin-right:8px" />
              <button id="loginBtn" class="btn">Entrar</button>
              <button id="registerBtn" class="btn btn-ghost" style="margin-left:8px">Registrar</button>
              <div id="loginMsg" class="small inline-msg" style="display:none;margin-left:8px;margin-top:8px"></div>
            </div>
            <div id="logged" style="display:none;align-items:center;gap:8px;flex-direction:column;align-items:flex-start">
              <div style="display:flex;align-items:center;gap:12px">
                <span id="who" class="small"></span>
                <button id="logoutBtn" class="btn btn-ghost">Cerrar sesión</button>
              </div>
              <div style="display:flex;align-items:center;gap:10px">
                <img id="bizLogo" src="" alt="logo" style="width:48px;height:48px;border-radius:8px;display:none;object-fit:cover;border:1px solid rgba(0,0,0,0.06)" />
                <div style="display:flex;flex-direction:column">
                  <div id="bizNameLine" style="font-weight:700;color:var(--accent)"></div>
                  <div id="bizInfo" class="small" style="display:none;margin-top:6px;color:var(--muted)"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Controls visible only after login -->
          <div id="postAuthControls" style="display:none;margin-top:12px">
            <label>Filtrar estado: 
              <select id="filterState">
                <option value="all">Todos</option>
                <option value="pending">Pendientes</option>
                <option value="paid">Pagados</option>
              </select>
            </label>
            <button id="reload" class="btn btn-ghost" style="margin-left:12px">Refrescar</button>
          </div>
        </div>

        <div class="card" id="list" style="display:none;margin-top:12px">
          <table>
            <thead>
              <tr><th>ID</th><th>Cliente</th><th>Items</th><th>Total</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <div id="detail" class="card" style="display:none;margin-top:12px"></div>
      </main>
    </div>
  </div>

  <!-- Registration modal overlay -->
  <div id="registerOverlay" class="modal-overlay" style="display:none">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="regTitle">
      <h3 id="regTitle">Crear cuenta</h3>
      <div class="form-row" style="margin-top:8px">
        <input id="regUser" placeholder="Usuario" />
        <input id="regPass" placeholder="Contraseña" type="password" />
      </div>
      <div class="form-row" style="margin-top:10px;align-items:center">
        <div class="roles">
          <label><input type="radio" name="regRole" value="cliente" checked /> Cliente</label>
          <label><input type="radio" name="regRole" value="negocio" /> Negocio</label>
        </div>
        <div id="regMsg" class="small inline-msg" style="display:none"></div>
      </div>

      <!-- Business fields shown only when role=negocio -->
      <div id="businessFields" style="display:none;margin-top:12px">
        <div class="form-row" style="margin-bottom:8px">
          <input id="regBizName" placeholder="Nombre del negocio" />
        </div>
        <div class="form-row" style="margin-bottom:8px">
          <input id="regBizEmail" placeholder="Correo electrónico" />
        </div>
        <div class="form-row" style="margin-bottom:8px">
          <input id="regBizPhone" placeholder="Teléfono (ej. 573242281300)" />
        </div>
        <div class="form-row" style="margin-bottom:8px">
          <input id="regBizAddress" placeholder="Dirección" />
        </div>
      </div>

      <div class="modal-actions">
        <button id="regCancel" class="btn btn-ghost">Cancelar</button>
        <button id="regSubmit" class="btn" style="margin-left:8px">Crear cuenta</button>
      </div>
    </div>
  </div>

  <!-- Edit profile modal -->
  <div id="editOverlay" class="modal-overlay" style="display:none">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <h3 id="editTitle">Editar perfil del negocio</h3>
      <div style="margin-top:8px">
        <div class="form-row" style="margin-bottom:8px">
          <input id="editBizName" placeholder="Nombre del negocio" />
        </div>
        <div class="form-row" style="margin-bottom:8px">
          <input id="editBizEmail" placeholder="Correo electrónico" />
        </div>
        <div class="form-row" style="margin-bottom:8px">
          <input id="editBizPhone" placeholder="Teléfono (ej. 573242281300)" />
        </div>
        <div class="form-row" style="margin-bottom:8px">
          <input id="editBizAddress" placeholder="Dirección" />
        </div>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
          <input id="editLogoFile" type="file" accept="image/*" />
          <img id="editLogoPreview" src="" style="width:56px;height:56px;border-radius:8px;object-fit:cover;display:none;border:1px solid rgba(0,0,0,0.06)" />
          <div id="editMsg" class="small inline-msg" style="display:none"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button id="editCancel" class="btn btn-ghost">Cancelar</button>
        <button id="editSave" class="btn" style="margin-left:8px">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function safeUrl(u){ try{ const x=new URL(u, location.origin); if(x.protocol==='http:'||x.protocol==='https:') return x.href; }catch(e){} return '#'; }
    function getToken(){ return localStorage.getItem('admin_token'); }
    function setToken(t){ if(t) localStorage.setItem('admin_token', t); else localStorage.removeItem('admin_token'); }
    function getUser(){ try{ return JSON.parse(localStorage.getItem('admin_user')); }catch(e){ return null } }
    function setUser(u){ if(u) localStorage.setItem('admin_user', JSON.stringify(u)); else localStorage.removeItem('admin_user'); updateAuthUI(); }

    async function apiFetch(path, opts){
      opts = opts || {};
      opts.headers = opts.headers || {};
      const token = getToken();
      if(token) opts.headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch('' + path, opts);
      return res;
    }

    function fmtMoney(n){ return '$' + Number(n).toLocaleString('es-CO'); }

    function showUnauthorized(){
      // hide post-auth controls and list until user logs in
      const rows = document.getElementById('rows');
      if(rows) rows.innerHTML = '';
      const post = document.getElementById('postAuthControls'); if(post) post.style.display = 'none';
      const list = document.getElementById('list'); if(list) list.style.display = 'none';
      document.getElementById('detail').style.display = 'none';
    }

    function showAuthorized(){
      const post = document.getElementById('postAuthControls'); if(post) post.style.display = 'block';
      const list = document.getElementById('list'); if(list) list.style.display = 'block';
      document.getElementById('filterState').disabled = false;
      document.getElementById('reload').disabled = false;
    }

    function showInlineMessage(id, msg, type){
      const el = document.getElementById(id);
      if(!el) return;
      el.textContent = msg || '';
      el.style.display = msg ? 'block' : 'none';
      el.classList.remove('error','success');
      if(type === 'error'){ el.classList.add('error'); el.classList.remove('success'); }
      else if(type === 'success'){ el.classList.add('success'); el.classList.remove('error'); }
      else { el.classList.remove('error','success'); }
    }

    function markFieldError(id, message){
      const el = document.getElementById(id);
      if(el) el.classList.add('error');
      if(message) showInlineMessage('regMsg', message, 'error');
    }
    function clearFieldError(id){ const el = document.getElementById(id); if(el) el.classList.remove('error'); }

    async function fetchOrders(){
      const res = await apiFetch('/api/orders');
      if(res.status === 401 || res.status === 403){ setToken(null); setUser(null); throw new Error('Unauthorized'); }
      return res.json();
    }

    async function load(){
      updateAuthUI();
      const token = getToken();
      if(!token){ showUnauthorized(); return; }
      // try to refresh user info (to get business metadata)
      try{
        const meRes = await apiFetch('/api/me');
        if(meRes.ok){
          const me = await meRes.json();
          setUser(me);
        }
      }catch(e){ /* ignore */ }
      // token present -> show authorized UI
      showAuthorized();
      const state = document.getElementById('filterState').value;
      const rows = document.getElementById('rows'); rows.innerHTML = '<tr><td colspan="6">Cargando...</td></tr>';
      try{
        const orders = await fetchOrders();
        const filtered = orders.filter(o=> state==='all' ? true : o.status===state);
        if(filtered.length===0){ rows.innerHTML = '<tr><td colspan="6">No hay pedidos</td></tr>'; return }
        document.getElementById('filterState').disabled = false;
        document.getElementById('reload').disabled = false;
        rows.innerHTML = filtered.map(o=>{
          const items = o.items.map(i=>`${esc(i.name)} x${esc(i.qty)}`).join(', ');
          return `<tr>
            <td>#${esc(o.id)}</td>
            <td>${esc(o.customer_name || 'Anon')}<div class="small">${esc(new Date(o.created_at).toLocaleString())}</div></td>
            <td>${items}</td>
            <td>${fmtMoney(o.total)}</td>
            <td class="${o.status==='paid' ? 'status-paid' : 'status-pending'}">${esc(o.status)}</td>
            <td>
              <button class="btn" onclick="view(${Number(o.id)})">Ver</button>
                <button class="btn btn-ghost" style="margin-left:6px" onclick="sendOrderWA(${Number(o.id)})">Enviar WA</button>
                ${o.status!=='paid' ? `<button class="btn" style="background:#059669;margin-left:6px" onclick="markPaid(${Number(o.id)})">Marcar como pagado</button>` : ''}
              </td>
          </tr>`
        }).join('');
      }catch(err){
        showUnauthorized();
      }
    }
    async function view(id){
      const d = document.getElementById('detail'); d.style.display='block'; d.innerHTML='Cargando...';
      const res = await apiFetch(`/api/orders/${id}`);
      if(res.status === 401 || res.status === 403){ setToken(null); setUser(null); showUnauthorized(); d.innerHTML='No autorizado'; return }
      if(!res.ok){ d.innerHTML='Pedido no encontrado'; return }
      const o = await res.json();
      const itemsHtml = o.items.map(i=>`<li>${esc(i.name)} x ${esc(i.qty)} — ${fmtMoney(i.price)}</li>`).join('');
      d.innerHTML = `
        <h3>Pedido #${esc(o.id)} <small class="small">${esc(new Date(o.created_at).toLocaleString())}</small></h3>
        <p><strong>Cliente:</strong> ${esc(o.customer_name)}</p>
        <ul>${itemsHtml}</ul>
        <p><strong>Total:</strong> ${fmtMoney(o.total)}</p>
        <p><strong>Estado:</strong> <span class="${o.status==='paid' ? 'status-paid' : 'status-pending'}">${esc(o.status)}</span></p>
        ${o.proof_url ? `<p><strong>Comprobante:</strong> <a href="${safeUrl(o.proof_url)}" target="_blank" rel="noopener">Ver comprobante</a></p>` : ''}
        <div style="margin-top:12px">
          ${o.status!=='paid' ? `<input id="proof_input" placeholder="URL comprobante (opcional)" style="width:60%" /> <button class="btn" onclick="confirmFromDetail(${Number(o.id)})">Confirmar pago</button>` : ''}
          <button class="btn btn-ghost" style="margin-left:8px" onclick="closeDetail()">Cerrar</button>
        </div>
      `;
    }

    function closeDetail(){ document.getElementById('detail').style.display='none'; }

    async function markPaid(id){
      if(!confirm('Marcar pedido #'+id+' como pagado?')) return;
      const res = await apiFetch(`/api/orders/${id}/confirm-payment`, { method: 'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ proof_url: null }) });
      if(res.status === 401 || res.status === 403){ setToken(null); setUser(null); showUnauthorized(); alert('No autorizado'); return }
      if(!res.ok){ alert('Error al marcar'); return }
      await load();
      alert('Pedido marcado como pagado');
    }

    async function sendOrderWA(id){
      try{
        const res = await apiFetch(`/api/orders/${id}`);
        if(!res.ok){ alert('No se pudo cargar la orden'); return }
        const order = await res.json();
        const user = getUser();
        // prefer customer phone if present, else business phone
        const toPhone = order.customer_phone || (user && user.business && user.business.phone) || (await (await fetch('/api/config')).json()).whatsapp_number;
        const lines = order.items.map(i=> `${i.name} x${i.qty} — ${fmtMoney(i.price * i.qty)}`);
        lines.push('Total: ' + fmtMoney(order.total));
        lines.push('Pedido ID: ' + order.id);
        const text = encodeURIComponent('Detalle de pedido\n' + lines.join('\n'));
        const url = `https://wa.me/${toPhone}?text=${text}`;
        window.open(url, '_blank');
      }catch(e){ alert('Error enviando WA: '+e.message); }
    }


    async function confirmFromDetail(id){
      const proof = document.getElementById('proof_input').value.trim();
      const res = await apiFetch(`/api/orders/${id}/confirm-payment`, { method: 'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ proof_url: proof || null }) });
      if(res.status === 401 || res.status === 403){ setToken(null); setUser(null); showUnauthorized(); alert('No autorizado'); return }
      if(!res.ok){ alert('Error al confirmar'); return }
      await load();
      view(id);
    }

    document.getElementById('reload').addEventListener('click', load);
    document.getElementById('filterState').addEventListener('change', load);

    // Login flow
    async function doLogin(){
      showInlineMessage('loginMsg','');
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      if(!user || !pass){ showInlineMessage('loginMsg','Usuario y contraseña requeridos', 'error'); return }
      if(user.length < 3){ showInlineMessage('loginMsg','Usuario muy corto (mínimo 3 caracteres)', 'error'); return }
      if(pass.length < 6){ showInlineMessage('loginMsg','Contraseña muy corta (mínimo 6 caracteres)', 'error'); return }
      const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.textContent = 'Entrando...';
      try{
        const res = await fetch('/api/login', { method: 'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ username: user, password: pass }) });
        if(!res.ok){ const data = await res.json(); throw new Error(data.error || 'Credenciales inválidas'); }
        const data = await res.json();
        setToken(data.token);
        setUser(data.user || { username: user });
        document.getElementById('loginUser').value=''; document.getElementById('loginPass').value='';
        showInlineMessage('loginMsg','Autenticación correcta', 'success');
        await load();
      }catch(err){ showInlineMessage('loginMsg','Login fallido: '+err.message, 'error'); }
      finally{ btn.disabled = false; btn.textContent = 'Entrar'; }
    }

    async function doRegister(){
      showInlineMessage('regMsg','');
      clearFieldError('regUser'); clearFieldError('regPass'); clearFieldError('regBizName'); clearFieldError('regBizEmail'); clearFieldError('regBizPhone'); clearFieldError('regBizAddress');
      const userEl = document.getElementById('regUser');
      const passEl = document.getElementById('regPass');
      const user = userEl.value.trim();
      const pass = passEl.value.trim();
      const roleEl = document.querySelector('input[name="regRole"]:checked');
      const role = roleEl ? roleEl.value : 'cliente';
      // business fields
      const bizNameEl = document.getElementById('regBizName'); const bizName = bizNameEl ? bizNameEl.value.trim() : '';
      const bizEmailEl = document.getElementById('regBizEmail'); const bizEmail = bizEmailEl ? bizEmailEl.value.trim() : '';
      const bizPhoneEl = document.getElementById('regBizPhone'); const bizPhone = bizPhoneEl ? bizPhoneEl.value.trim() : '';
      const bizAddressEl = document.getElementById('regBizAddress'); const bizAddress = bizAddressEl ? bizAddressEl.value.trim() : '';

      if(!user){ markFieldError('regUser','Usuario requerido'); document.getElementById('regUser').focus(); return }
      if(!pass){ markFieldError('regPass','Contraseña requerida'); document.getElementById('regPass').focus(); return }
      if(user.length < 3){ markFieldError('regUser','Usuario muy corto (mínimo 3 caracteres)'); document.getElementById('regUser').focus(); return }
      if(pass.length < 6){ markFieldError('regPass','Contraseña muy corta (mínimo 6 caracteres)'); document.getElementById('regPass').focus(); return }

      if(role === 'negocio'){
        if(!bizName) { markFieldError('regBizName','Nombre del negocio requerido'); bizNameEl.focus(); return }
        if(!bizEmail || !/^\S+@\S+\.\S+$/.test(bizEmail)) { markFieldError('regBizEmail','Correo inválido'); bizEmailEl.focus(); return }
        if(!bizPhone || !/^[0-9+]{7,20}$/.test(bizPhone)) { markFieldError('regBizPhone','Teléfono inválido'); bizPhoneEl.focus(); return }
        if(!bizAddress) { markFieldError('regBizAddress','Dirección requerida'); bizAddressEl.focus(); return }
      }

      const btn = document.getElementById('regSubmit'); btn.disabled = true; btn.textContent = 'Creando...';
      try{
        const payload = { username: user, password: pass, role };
        if(role === 'negocio') payload.business = { name: bizName, email: bizEmail, phone: bizPhone, address: bizAddress };
        const res = await fetch('/api/register', { method: 'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(payload) });
        if(!res.ok){ const t = await res.json(); throw new Error(t.error || 'Registro fallido') }
        const data = await res.json();
        setToken(data.token);
        setUser(data.user || { username: user, role });
        document.getElementById('regUser').value=''; document.getElementById('regPass').value='';
        // clear business fields
        if(document.getElementById('regBizName')) document.getElementById('regBizName').value='';
        if(document.getElementById('regBizEmail')) document.getElementById('regBizEmail').value='';
        if(document.getElementById('regBizPhone')) document.getElementById('regBizPhone').value='';
        if(document.getElementById('regBizAddress')) document.getElementById('regBizAddress').value='';
        showInlineMessage('regMsg','Registro exitoso', 'success');
        hideRegisterForm();
        await load();
      }catch(err){ showInlineMessage('regMsg','Registro fallido: '+err.message, 'error'); }
      finally{ btn.disabled = false; btn.textContent = 'Crear cuenta'; }
    }

    document.getElementById('loginBtn').addEventListener('click', (e)=>{ e.preventDefault(); doLogin(); });
    // open registration form
    document.getElementById('registerBtn').addEventListener('click', (e)=>{ e.preventDefault(); showRegisterForm(); });
    document.getElementById('regSubmit').addEventListener('click', (e)=>{ e.preventDefault(); doRegister(); });
    document.getElementById('regCancel').addEventListener('click', (e)=>{ e.preventDefault(); hideRegisterForm(); });
    document.getElementById('logoutBtn').addEventListener('click', ()=>{ setToken(null); setUser(null); load(); });

    // handle role change -> show/hide business fields
    document.querySelectorAll('input[name="regRole"]').forEach(r=> r.addEventListener('change', ()=>{
      const val = document.querySelector('input[name="regRole"]:checked').value;
      const bf = document.getElementById('businessFields');
      if(bf) bf.style.display = (val === 'negocio') ? 'block' : 'none';
    }));

    // clear field errors on input
    ['regUser','regPass','regBizName','regBizEmail','regBizPhone','regBizAddress'].forEach(id=>{
      const el = document.getElementById(id); if(!el) return; el.addEventListener('input', ()=>{ clearFieldError(id); showInlineMessage('regMsg',''); });
    });

    // overlay controls
    document.getElementById('registerOverlay').addEventListener('click', (e)=>{ if(e.target && e.target.id === 'registerOverlay') hideRegisterForm(); });

    // edit profile overlay controls
    document.getElementById('editOverlay').addEventListener('click', (e)=>{ if(e.target && e.target.id === 'editOverlay') hideEditForm(); });

    function showRegisterForm(){
      showInlineMessage('regMsg','');
      // prefill registration inputs with login inputs to avoid user confusion
      try{
        const loginUser = document.getElementById('loginUser');
        const loginPass = document.getElementById('loginPass');
        const regUserEl = document.getElementById('regUser');
        const regPassEl = document.getElementById('regPass');
        if(loginUser && regUserEl) regUserEl.value = loginUser.value || '';
        if(loginPass && regPassEl) regPassEl.value = loginPass.value || '';
      }catch(e){ /* ignore */ }
      document.getElementById('registerOverlay').style.display = 'flex';
      // reset business fields visibility based on selected role
      const val = document.querySelector('input[name="regRole"]:checked').value;
      const bf = document.getElementById('businessFields'); if(bf) bf.style.display = (val === 'negocio') ? 'block' : 'none';
      // focus first field
      setTimeout(()=>document.getElementById('regUser').focus(),50);
    }
    function hideRegisterForm(){
      showInlineMessage('regMsg','');
      document.getElementById('registerOverlay').style.display = 'none';
    }

    // Edit profile modal handlers
    function showEditForm(){
      showInlineMessage('editMsg','');
      const user = getUser();
      if(user && user.business){
        document.getElementById('editBizName').value = user.business.name || '';
        document.getElementById('editBizEmail').value = user.business.email || '';
        document.getElementById('editBizPhone').value = user.business.phone || '';
        document.getElementById('editBizAddress').value = user.business.address || '';
        if(user.business.logo){ document.getElementById('editLogoPreview').src = user.business.logo; document.getElementById('editLogoPreview').style.display = 'block'; }
        else { document.getElementById('editLogoPreview').style.display = 'none'; }
      } else {
        document.getElementById('editBizName').value = '';
        document.getElementById('editBizEmail').value = '';
        document.getElementById('editBizPhone').value = '';
        document.getElementById('editBizAddress').value = '';
        document.getElementById('editLogoPreview').style.display = 'none';
      }
      document.getElementById('editOverlay').style.display = 'flex';
      setTimeout(()=>document.getElementById('editBizName').focus(),50);
    }
    function hideEditForm(){ showInlineMessage('editMsg',''); document.getElementById('editOverlay').style.display = 'none'; }

    document.getElementById('editCancel').addEventListener('click', (e)=>{ e.preventDefault(); hideEditForm(); });
    document.getElementById('editOverlay').addEventListener('click', (e)=>{ if(e.target && e.target.id==='editOverlay') hideEditForm(); });

    // file input preview + read
    let _editLogoData = null;
    document.getElementById('editLogoFile').addEventListener('change', (e)=>{
      const f = e.target.files && e.target.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = function(ev){ _editLogoData = ev.target.result; document.getElementById('editLogoPreview').src = _editLogoData; document.getElementById('editLogoPreview').style.display = 'block'; };
      reader.readAsDataURL(f);
    });

    document.getElementById('editSave').addEventListener('click', async (e)=>{
      e.preventDefault();
      showInlineMessage('editMsg','');
      const name = document.getElementById('editBizName').value.trim();
      const email = document.getElementById('editBizEmail').value.trim();
      const phone = document.getElementById('editBizPhone').value.trim();
      const address = document.getElementById('editBizAddress').value.trim();
      if(!name){ showInlineMessage('editMsg','Nombre del negocio requerido','error'); return }
      if(email && !/^\S+@\S+\.\S+$/.test(email)){ showInlineMessage('editMsg','Correo inválido','error'); return }
      if(phone && !/^[0-9+]{7,20}$/.test(phone)){ showInlineMessage('editMsg','Teléfono inválido','error'); return }
      const saveBtn = document.getElementById('editSave'); saveBtn.disabled = true; saveBtn.textContent = 'Guardando...';
      try{
        let logoUrl = null;
        if(_editLogoData){
          const r = await fetch('/api/me/avatar', { method: 'POST', headers: {'content-type':'application/json', 'Authorization': 'Bearer ' + getToken()}, body: JSON.stringify({ image: _editLogoData }) });
          if(!r.ok) throw new Error('Error subiendo logo');
          const jr = await r.json(); logoUrl = jr.url;
        }
        const payload = { business: { name, email, phone, address } };
        if(logoUrl) payload.business.logo = logoUrl;
        const res = await fetch('/api/me', { method: 'PUT', headers: {'content-type':'application/json', 'Authorization': 'Bearer ' + getToken()}, body: JSON.stringify(payload) });
        if(!res.ok){ const t = await res.json(); throw new Error(t.error || 'Error guardando'); }
        const updated = await res.json();
        setUser(updated);
        showInlineMessage('editMsg','Actualizado','success');
        hideEditForm();
        updateAuthUI();
      }catch(err){ showInlineMessage('editMsg','No se pudo guardar: '+err.message,'error'); }
      finally{ saveBtn.disabled = false; saveBtn.textContent = 'Guardar'; }
    });


    function updateAuthUI(){
      const token = getToken();
      const user = getUser();
      const bizEl = document.getElementById('bizInfo');
      const sidebar = document.getElementById('sidebar');
      const sidebarLogo = document.getElementById('sidebarLogo');
      const sidebarBizName = document.getElementById('sidebarBizName');

      if(token && user){
        document.getElementById('loginForm').style.display='none';
        document.getElementById('logged').style.display='flex';
        document.getElementById('who').textContent='Conectado: '+(user.username || '') + (user.role ? ' ('+user.role+')' : '');

        // show business info when available
        if(user.business && bizEl){
          const b = user.business;
          let parts = [];
          if(b.name) parts.push(`<strong>${b.name}</strong>`);
          if(b.email) parts.push(`✉ ${b.email}`);
          if(b.phone) parts.push(`📞 ${b.phone}`);
          if(b.address) parts.push(`📍 ${b.address}`);
          bizEl.innerHTML = parts.join(' &nbsp; · &nbsp; ');
          bizEl.style.display = 'block';
        } else if(bizEl){
          bizEl.innerHTML = '';
          bizEl.style.display = 'none';
        }

        // If user is negocio, show sidebar and admin areas; otherwise restrict
        if(user.role === 'negocio'){
          if(sidebar) sidebar.style.display = 'block';
          if(sidebarLogo && user.business && user.business.logo){ sidebarLogo.src = user.business.logo; sidebarLogo.style.display='block'; }
          if(sidebarBizName) sidebarBizName.textContent = (user.business && user.business.name) ? user.business.name : (user.username || 'Negocio');
          const publicLink = document.getElementById('publicLink'); if(publicLink){ if(user.business && user.business.slug){ publicLink.href = '/b/' + encodeURIComponent(user.business.slug); publicLink.style.display = 'inline-block'; } else { publicLink.style.display = 'none'; } }
          const post = document.getElementById('postAuthControls'); if(post) post.style.display = 'block';
          const list = document.getElementById('list'); if(list) list.style.display = 'block';
        } else {
          // not a negocio: hide admin areas
          if(sidebar) sidebar.style.display = 'none';
          const post = document.getElementById('postAuthControls'); if(post) post.style.display = 'none';
          const list = document.getElementById('list'); if(list) list.style.display = 'none';
          // show a message in main content
          const d = document.getElementById('detail'); d.style.display='block'; d.innerHTML = '<div class="card">Acceso denegado: este panel es solo para cuentas con rol "negocio".</div>';
        }

      } else {
        document.getElementById('loginForm').style.display='block';
        document.getElementById('logged').style.display='none';
        document.getElementById('who').textContent='';
        if(bizEl){ bizEl.innerHTML=''; bizEl.style.display='none'; }
        // hide post-auth areas
        const post = document.getElementById('postAuthControls'); if(post) post.style.display = 'none';
        const list = document.getElementById('list'); if(list) list.style.display = 'none';
        if(sidebar) sidebar.style.display = 'none';
      }
    }

    // Navigation handling for sidebar
    function showSection(section){
      // clear active
      document.querySelectorAll('.side-link').forEach(a=> a.classList.remove('active'));
      const sel = document.querySelector('.side-link[data-section="'+section+'"]'); if(sel) sel.classList.add('active');
      const detail = document.getElementById('detail'); const list = document.getElementById('list');
      // default hide both
      if(detail) detail.style.display='none'; if(list) list.style.display='none';
      if(section === 'dashboard'){
        // show a quick dashboard
        if(detail){
          detail.style.display='block';
          detail.innerHTML = '<h3>Dashboard</h3><p class="small">Resumen rápido de actividad</p><div id="dashContent" style="margin-top:12px">Cargando...</div>';
          const dash = document.getElementById('dashContent');
          (async ()=>{
            try{
              const res = await apiFetch('/api/orders'); if(!res.ok){ dash.innerHTML='No autorizado'; return }
              const orders = await res.json();
              const total = orders.length;
              const paid = orders.filter(o=>o.status==='paid').length;
              const pending = orders.filter(o=>o.status!=='paid').length;
              const sales = orders.filter(o=>o.status==='paid').reduce((s,o)=>s + (o.total||0),0);
              dash.innerHTML = `<div style="display:flex;gap:12px;flex-wrap:wrap"><div class="card" style="flex:1;min-width:160px"><h4>Total Pedidos</h4><div style="font-size:20px;font-weight:800">${total}</div></div><div class="card" style="flex:1;min-width:160px"><h4>Pagados</h4><div style="font-size:20px;font-weight:800;color:var(--success)">${paid}</div></div><div class="card" style="flex:1;min-width:160px"><h4>Pendientes</h4><div style="font-size:20px;font-weight:800;color:#b45309">${pending}</div></div><div class="card" style="flex:1;min-width:160px"><h4>Ventas</h4><div style="font-size:20px;font-weight:800">${fmtMoney(sales)}</div></div></div>`;
            }catch(e){ dash.innerHTML='Error cargando dashboard'; }
          })();
        }
        if(list) { list.style.display='block'; load(); }
      } else if(section === 'orders'){
        if(list) { list.style.display='block'; load(); }
      } else if(section === 'inventory'){
        if(detail) {
          detail.style.display='block';
          detail.innerHTML = `
            <h3>Inventario</h3>
            <div class="small">Agregar / editar inventario de tu negocio</div>
            <div style="margin-top:12px">
              <div style="display:flex;gap:8px;align-items:center">
                <input id="invName" placeholder="Nombre del insumo" />
                <input id="invQty" placeholder="Cantidad" style="width:120px" />
                <input id="invUnit" placeholder="Unidad (ej. kg, un)" style="width:140px" />
                <button id="invAdd" class="btn">Agregar</button>
              </div>
              <div id="invMsg" class="small inline-msg" style="margin-top:8px;display:none"></div>
              <div id="invList" style="margin-top:12px">Cargando...</div>
            </div>
          `;
          // load items
          const invListEl = document.getElementById('invList');
          async function loadInv(){
            try{
              const res = await apiFetch('/api/inventory');
              if(!res.ok){ invListEl.innerHTML = 'No autorizado o error'; return }
              const items = await res.json();
              if(items.length===0){ invListEl.innerHTML = '<div>No hay elementos</div>'; return }
              invListEl.innerHTML = `<table style="width:100%;border-collapse:collapse"><thead><tr><th>Nombre</th><th>Cantidad</th><th>Unidad</th><th>Acciones</th></tr></thead><tbody>${items.map(i=>`<tr data-id="${i.id}"><td>${i.name}</td><td>${i.qty}</td><td>${i.unit||''}</td><td><button class="btn" data-action="edit">Editar</button> <button class="btn btn-ghost" data-action="del">Eliminar</button></td></tr>`).join('')}</tbody></table>`;
              // attach actions
              invListEl.querySelectorAll('button[data-action]').forEach(b=> b.addEventListener('click', async (e)=>{
                const tr = e.target.closest('tr'); const id = tr.getAttribute('data-id'); const action = e.target.getAttribute('data-action');
                if(action === 'del'){
                  if(!confirm('Eliminar este item?')) return; const r = await apiFetch('/api/inventory/'+id,{ method:'DELETE' }); if(!r.ok){ alert('Error'); return } loadInv();
                } else if(action === 'edit'){
                  const name = prompt('Nuevo nombre', tr.children[0].textContent) || tr.children[0].textContent;
                  const qty = prompt('Cantidad', tr.children[1].textContent) || tr.children[1].textContent;
                  const unit = prompt('Unidad', tr.children[2].textContent) || tr.children[2].textContent;
                  const r = await apiFetch('/api/inventory/'+id, { method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify({ name, qty, unit }) }); if(!r.ok){ alert('Error'); return } loadInv();
                }
              }));
            }catch(err){ invListEl.innerHTML = 'Error cargando inventario'; }
          }
          loadInv();
          document.getElementById('invAdd').addEventListener('click', async ()=>{
            const name = document.getElementById('invName').value.trim(); const qty = document.getElementById('invQty').value.trim(); const unit = document.getElementById('invUnit').value.trim();
            const msgEl = document.getElementById('invMsg'); msgEl.style.display='none';
            if(!name){ msgEl.textContent='Nombre requerido'; msgEl.className='small inline-msg error'; msgEl.style.display='block'; return }
            const r = await apiFetch('/api/inventory', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ name, qty: Number(qty||0), unit }) });
            if(!r.ok){ const t=await r.json(); msgEl.textContent = t.error || 'Error'; msgEl.className='small inline-msg error'; msgEl.style.display='block'; return }
            document.getElementById('invName').value=''; document.getElementById('invQty').value=''; document.getElementById('invUnit').value='';
            msgEl.textContent='Agregado'; msgEl.className='small inline-msg success'; msgEl.style.display='block';
            loadInv();
          });
        }
      } else if(section === 'menu'){
        if(detail){
          detail.style.display='block';
          detail.innerHTML = `
            <h3>Menú</h3>
            <div class="small">Gestiona los platos de tu negocio</div>
            <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
              <input id="menuName" placeholder="Nombre del producto" />
              <input id="menuPrice" placeholder="Precio" style="width:120px" />
              <label style="display:flex;align-items:center;gap:6px"><input id="menuAvail" type="checkbox" /> Disponible</label>
              <button id="menuAdd" class="btn">Agregar</button>
            </div>
            <div id="menuMsg" class="small inline-msg" style="margin-top:8px;display:none"></div>
            <div id="menuList" style="margin-top:12px">Cargando...</div>
          `;
          const menuListEl = document.getElementById('menuList');
          async function loadMenuItems(){
            try{
              const res = await apiFetch('/api/menu/my'); if(!res.ok){ menuListEl.innerHTML='No autorizado'; return }
              const items = await res.json();
              if(items.length===0){ menuListEl.innerHTML = '<div>No hay productos</div>'; return }
              menuListEl.innerHTML = `<table style="width:100%;border-collapse:collapse"><thead><tr><th>Nombre</th><th>Precio</th><th>Disponible</th><th>Acciones</th></tr></thead><tbody>${items.map(i=>`<tr data-id="${i.id}"><td>${i.name}</td><td>${i.price}</td><td>${i.available? 'Sí':'No'}</td><td><button class="btn" data-action="edit">Editar</button> <button class="btn btn-ghost" data-action="del">Eliminar</button></td></tr>`).join('')}</tbody></table>`;
              menuListEl.querySelectorAll('button[data-action]').forEach(b=> b.addEventListener('click', async (e)=>{
                const tr = e.target.closest('tr'); const id = tr.getAttribute('data-id'); const action = e.target.getAttribute('data-action');
                if(action === 'del'){
                  if(!confirm('Eliminar este producto?')) return; const r = await apiFetch('/api/menu/'+id,{ method:'DELETE' }); if(!r.ok){ alert('Error'); return } loadMenuItems();
                } else if(action === 'edit'){
                  const name = prompt('Nuevo nombre', tr.children[0].textContent) || tr.children[0].textContent;
                  const price = prompt('Precio', tr.children[1].textContent) || tr.children[1].textContent;
                  const avail = confirm('¿Disponible?');
                  const r = await apiFetch('/api/menu/'+id, { method:'PUT', headers:{'content-type':'application/json'}, body: JSON.stringify({ name, price: Number(price||0), available: avail }) }); if(!r.ok){ alert('Error'); return } loadMenuItems();
                }
              }));
            }catch(err){ menuListEl.innerHTML='Error cargando menú'; }
          }
          loadMenuItems();
          document.getElementById('menuAdd').addEventListener('click', async ()=>{
            const name = document.getElementById('menuName').value.trim();
            const price = Number(document.getElementById('menuPrice').value||0);
            const avail = document.getElementById('menuAvail').checked;
            const msgEl = document.getElementById('menuMsg'); msgEl.style.display='none';
            if(!name){ msgEl.textContent='Nombre requerido'; msgEl.className='small inline-msg error'; msgEl.style.display='block'; return }
            const r = await apiFetch('/api/menu', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ name, price, available: avail }) });
            if(!r.ok){ const t = await r.json(); msgEl.textContent = t.error || 'Error'; msgEl.className='small inline-msg error'; msgEl.style.display='block'; return }
            document.getElementById('menuName').value=''; document.getElementById('menuPrice').value=''; document.getElementById('menuAvail').checked=false;
            msgEl.textContent='Agregado'; msgEl.className='small inline-msg success'; msgEl.style.display='block';
            loadMenuItems();
          });
        }
      } else if(section === 'cash'){
        if(detail) {
          detail.style.display='block';
          detail.innerHTML = `
            <h3>Caja</h3>
            <div class="small">Registrar movimientos de caja</div>
            <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
              <select id="cashType"><option value="sale">Venta</option><option value="egress">Egreso</option><option value="income">Ingreso</option></select>
              <input id="cashAmount" placeholder="Monto" style="width:120px" />
              <input id="cashNote" placeholder="Nota" />
              <button id="cashAdd" class="btn">Registrar</button>
            </div>
            <div id="cashMsg" class="small inline-msg" style="margin-top:8px;display:none"></div>
            <div id="cashList" style="margin-top:12px">Cargando...</div>
          `;
          const cashListEl = document.getElementById('cashList');
          async function loadCash(){
            try{
              const res = await apiFetch('/api/cash'); if(!res.ok){ cashListEl.innerHTML='No autorizado'; return }
              const items = await res.json();
              if(items.length===0){ cashListEl.innerHTML = '<div>No hay movimientos</div>'; return }
              cashListEl.innerHTML = `<table style="width:100%;border-collapse:collapse"><thead><tr><th>ID</th><th>Tipo</th><th>Monto</th><th>Nota</th><th>Fecha</th></tr></thead><tbody>${items.map(c=>`<tr><td>#${c.id}</td><td>${c.type}</td><td>${c.amount}</td><td>${c.note||''}</td><td>${new Date(c.created_at).toLocaleString()}</td></tr>`).join('')}</tbody></table>`;
            }catch(e){ cashListEl.innerHTML='Error cargando movimientos'; }
          }
          loadCash();
          document.getElementById('cashAdd').addEventListener('click', async ()=>{
            const type = document.getElementById('cashType').value; const amount = Number(document.getElementById('cashAmount').value||0); const note = document.getElementById('cashNote').value;
            const msgEl = document.getElementById('cashMsg'); msgEl.style.display='none';
            if(!type || !amount){ msgEl.textContent='Tipo y monto requeridos'; msgEl.className='small inline-msg error'; msgEl.style.display='block'; return }
            const r = await apiFetch('/api/cash', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ type, amount, note }) });
            if(!r.ok){ const t=await r.json(); msgEl.textContent = t.error || 'Error'; msgEl.className='small inline-msg error'; msgEl.style.display='block'; return }
            document.getElementById('cashAmount').value=''; document.getElementById('cashNote').value='';
            msgEl.textContent='Moviento registrado'; msgEl.className='small inline-msg success'; msgEl.style.display='block';
            loadCash();
          });
        }
      } else if(section === 'profile'){
        // open edit profile
        showEditForm();
      }
    }

    // attach sidebar events
    document.addEventListener('click', function(e){
      const t = e.target;
      if(t && t.classList && t.classList.contains('side-link')){
        e.preventDefault(); const sec = t.getAttribute('data-section'); if(sec) showSection(sec);
      }
    });
    const sidebarLogout = document.getElementById('sidebarLogout'); if(sidebarLogout) sidebarLogout.addEventListener('click', (e)=>{ e.preventDefault(); setToken(null); setUser(null); load(); });

    updateAuthUI();
    load();
  </script>
</body>
</html>
