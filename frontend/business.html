<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Negocio</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo"><div class="brand">tiagPOS</div></div>
      <div id="bizContact"></div>
    </header>

    <main>
      <div id="bizHeader" style="display:flex;align-items:center;gap:16px;margin-bottom:18px">
        <img id="bizLogo" src="" style="width:84px;height:84px;border-radius:12px;display:none;object-fit:cover;border:1px solid rgba(0,0,0,0.06)" />
        <div>
          <h1 id="bizName" style="margin:0;color:var(--accent)"></h1>
          <div id="bizDesc" class="small" style="color:var(--muted)"></div>
        </div>
      </div>

      <div class="card" id="menuCard">
        <h3>Menú</h3>
        <div id="menuList">Cargando...</div>
      </div>

      <div class="card" id="cartCard" style="margin-top:12px">
        <h3>Carrito</h3>
        <div id="cartItems">No hay items en el carrito</div>
        <div style="margin-top:12px">
          <div id="cartTotal" style="font-weight:800"></div>
          <div id="orderMsg" class="small inline-msg" style="display:none;margin-top:8px"></div>
          <button id="waBtn" class="btn btn-primary" style="margin-top:8px;display:none">Enviar por WhatsApp</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtMoney(n){ return '$' + Number(n).toLocaleString('es-CO'); }
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const slug = (pathParts.length >= 2 && pathParts[0] === 'b') ? pathParts[1] : pathParts[0] || '';

    let BUSINESS = null;
    let MENU = [];
    let CART = [];

    async function loadBusiness(){
      try{
        const res = await fetch('/api/b/' + encodeURIComponent(slug));
        if(!res.ok){ document.getElementById('menuList').innerText = 'Negocio no encontrado'; return }
        const data = await res.json();
        BUSINESS = data.business || {};
        document.getElementById('bizName').textContent = BUSINESS.name || data.username || 'Negocio';
        if(BUSINESS.logo){ document.getElementById('bizLogo').src = BUSINESS.logo; document.getElementById('bizLogo').style.display='block'; }
        const contact = document.getElementById('bizContact');
        contact.textContent = '';
        if(BUSINESS.email) contact.append('✉ ' + BUSINESS.email);
        if(BUSINESS.phone) contact.append((BUSINESS.email ? ' • ' : '') + '📞 ' + BUSINESS.phone);
        loadMenu();
      }catch(e){ document.getElementById('menuList').innerText = 'Error cargando negocio'; }
    }

    async function loadMenu(){
      try{
        const res = await fetch('/api/menu?ownerSlug=' + encodeURIComponent(slug));
        if(!res.ok){ document.getElementById('menuList').innerText = 'Error cargando menú'; return }
        MENU = (await res.json()).filter(m => m.available !== false);
        renderMenu();
      }catch(e){ document.getElementById('menuList').innerText = 'Error cargando menú'; }
    }

    function renderMenu(){
      const el = document.getElementById('menuList');
      if(!MENU.length){
        el.innerHTML = '<div>No hay productos disponibles aún. El negocio puede agregarlos desde el panel admin.</div>';
        return;
      }
      el.innerHTML = MENU.map(m =>
        `<div class="menu-item"><div><strong>${esc(m.name)}</strong><div class="small">Disponible</div></div>` +
        `<div style="display:flex;gap:8px;align-items:center"><div class="menu-price">${fmtMoney(m.price)}</div>` +
        `<button class="add-btn" data-id="${Number(m.id)}">Agregar</button></div></div>`
      ).join('');
      el.querySelectorAll('.add-btn').forEach(b => b.addEventListener('click', ()=>{
        const id = Number(b.getAttribute('data-id'));
        const item = MENU.find(x => x.id === id);
        if(!item) return;
        const existing = CART.find(c => c.id === id);
        if(existing) existing.qty += 1;
        else CART.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
        renderCart();
      }));
    }

    function renderCart(){
      const el = document.getElementById('cartItems');
      if(!CART.length){
        el.innerHTML = 'No hay items en el carrito';
        document.getElementById('cartTotal').innerText = '';
        document.getElementById('waBtn').style.display='none';
        return;
      }
      el.innerHTML = '<ul>' + CART.map(c =>
        `<li>${esc(c.name)} x ${esc(c.qty)} — ${fmtMoney(c.price * c.qty)} ` +
        `<button data-id="${Number(c.id)}" class="btn btn-ghost" style="margin-left:8px">-</button></li>`
      ).join('') + '</ul>';
      el.querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', ()=>{
        const id = Number(b.getAttribute('data-id'));
        const idx = CART.findIndex(x => x.id === id);
        if(idx === -1) return;
        CART[idx].qty -= 1;
        if(CART[idx].qty <= 0) CART.splice(idx, 1);
        renderCart();
      }));
      const total = CART.reduce((s,i)=> s + i.qty * i.price, 0);
      document.getElementById('cartTotal').innerText = 'Total: ' + fmtMoney(total);
      const wa = document.getElementById('waBtn');
      wa.style.display='inline-block';
      wa.onclick = ()=> sendWhatsApp(total);
    }

    async function sendWhatsApp(){
      const msgEl = document.getElementById('orderMsg');
      msgEl.style.display='none';
      const customer = prompt('Nombre del cliente (opcional)') || 'Cliente';
      const phone = prompt('Teléfono del cliente (opcional, sin +)') || '';
      const items = CART.map(c => ({ id: c.id, name: c.name, price: c.price, qty: c.qty }));
      try{
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: {'content-type':'application/json'},
          body: JSON.stringify({ customer_name: customer, customer_phone: phone || null, items, ownerSlug: slug })
        });
        if(!res.ok){
          const t = await res.json().catch(()=>({}));
          msgEl.textContent = 'Error creando pedido: ' + (t.error || res.statusText);
          msgEl.className='small inline-msg error';
          msgEl.style.display='block';
          return;
        }
        const data = await res.json();
        let phoneTo = BUSINESS.phone;
        if(!phoneTo){
          const cfg = await fetch('/api/config').then(r=>r.json());
          phoneTo = cfg.whatsapp_number;
        }
        const lines = items.map(c => `${c.name} x${c.qty} — ${fmtMoney(c.price * c.qty)}`);
        lines.push('Total: ' + fmtMoney(data.total));
        lines.push('Pedido ID: ' + data.id);
        if(data.checkout_url) lines.push('Comprobante/checkout: ' + data.checkout_url);
        window.open(`https://wa.me/${phoneTo}?text=${encodeURIComponent('Nuevo pedido\n' + lines.join('\n'))}`, '_blank');
        msgEl.textContent = 'Pedido creado. ID: ' + data.id;
        msgEl.className='small inline-msg success';
        msgEl.style.display='block';
        CART = [];
        renderCart();
      }catch(e){
        msgEl.textContent = 'Error creando pedido: ' + e.message;
        msgEl.className='small inline-msg error';
        msgEl.style.display='block';
      }
    }

    if(!slug) document.getElementById('menuList').innerText = 'Negocio no especificado (url debe ser /b/:slug)';
    else loadBusiness();
  </script>
</body>
</html>
