<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Negocio</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem('tiagpos-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo"><div class="brand">WhatsMenú</div></div>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="bizContact"></div>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Cambiar tema">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main>
      <div id="bizBanner" class="biz-banner" aria-hidden="true">
        <img id="bizBannerImg" alt="" />
      </div>

      <div id="bizHeader" class="biz-header">
        <img id="bizLogo" class="biz-logo" src="" alt="logo" />
        <div class="biz-header-copy">
          <div class="biz-title-row">
            <h1 id="bizName"></h1>
            <span id="bizOpenBadge" class="biz-status" style="display:none"></span>
          </div>
          <div id="bizAddress" class="small biz-address" style="display:none"></div>
          <div id="bizDesc" class="small" style="color:var(--muted);margin-top:4px"></div>
        </div>
      </div>

      <div id="closedBanner" class="card" style="display:none;margin-bottom:12px;border-color:var(--accent-hot)">
        <strong>Negocio no disponible</strong>
        <p class="small" style="margin:6px 0 0">Este negocio no está recibiendo pedidos ahora. Puedes ver el menú, pero no enviar pedidos.</p>
      </div>

      <div class="card" id="menuCard">
        <h3>Menú</h3>
        <div id="menuList">Cargando...</div>
      </div>

      <div class="card" id="cartCard" style="margin-top:12px">
        <h3>Carrito</h3>
        <div id="cartItems">No hay items en el carrito</div>
        <div id="checkoutFields" style="display:none;margin-top:12px">
          <label class="small" for="custName">Tu nombre</label>
          <input id="custName" placeholder="Nombre" style="width:100%;margin:4px 0 8px;padding:8px;border:1px solid #ddd;border-radius:8px" />
          <label class="small" for="custPhone">Tu WhatsApp (opcional)</label>
          <input id="custPhone" placeholder="Ej. 3001234567" style="width:100%;margin:4px 0 8px;padding:8px;border:1px solid #ddd;border-radius:8px" />
          <label class="small" for="payMethod">Método de pago</label>
          <select id="payMethod" style="width:100%;margin:4px 0 8px;padding:8px;border:1px solid #ddd;border-radius:8px">
            <option value="efectivo">Efectivo</option>
            <option value="transferencia">Transferencia</option>
          </select>
          <label class="small" for="custAddress">Dirección de entrega</label>
          <input id="custAddress" placeholder="Barrio, calle, número, referencias" style="width:100%;margin:4px 0 8px;padding:8px;border:1px solid #ddd;border-radius:8px" />
          <label class="small" for="custNotes">Comentarios (opcional)</label>
          <textarea id="custNotes" rows="2" placeholder="Ej. Pago con $50.000, necesito vuelta" style="width:100%;margin:4px 0 8px;padding:8px;border:1px solid #ddd;border-radius:8px;resize:vertical"></textarea>
        </div>
        <div style="margin-top:12px">
          <div id="cartTotal" style="font-weight:800"></div>
          <div id="orderMsg" class="small inline-msg" style="display:none;margin-top:8px"></div>
          <button id="waBtn" class="btn btn-primary" style="margin-top:8px;display:none" type="button">Enviar pedido por WhatsApp</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtMoney(n){ return '$' + Number(n).toLocaleString('es-CO'); }

    /** Digits-only WhatsApp number with Colombia country code when needed */
    function normalizeWaPhone(raw){
      if(!raw) return '';
      let d = String(raw).replace(/\D/g, '');
      if(!d) return '';
      if(d.startsWith('00')) d = d.slice(2);
      // Colombian mobile 3xx xxx xxxx
      if(d.length === 10 && d.startsWith('3')) d = '57' + d;
      // local landline-ish 7 digits — skip
      return d;
    }

    function openWhatsAppToStore(phoneRaw, message){
      const phone = normalizeWaPhone(phoneRaw);
      if(!phone){
        throw new Error('La tienda no tiene un WhatsApp configurado. Pídele al negocio que agregue su teléfono en Perfil.');
      }
      const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(message);
      const w = window.open(url, '_blank');
      if(!w){
        // popup blocked — navigate same tab
        window.location.href = url;
      }
      return url;
    }

    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const slug = (pathParts.length >= 2 && pathParts[0] === 'b') ? pathParts[1] : pathParts[0] || '';

    let BUSINESS = null;
    let MENU = [];
    let CART = [];
    let SENDING = false;
    let IS_OPEN = true;

    function businessIsOpen(b){
      if(!b) return true;
      return typeof b.is_open === 'undefined' ? true : !!b.is_open;
    }

    async function loadBusiness(){
      try{
        const res = await fetch('/api/b/' + encodeURIComponent(slug));
        if(!res.ok){ document.getElementById('menuList').innerText = 'Negocio no encontrado'; return }
        const data = await res.json();
        BUSINESS = data.business || {};
        IS_OPEN = businessIsOpen(BUSINESS);
        document.getElementById('bizName').textContent = BUSINESS.name || data.username || 'Negocio';
        const logoEl = document.getElementById('bizLogo');
        if(BUSINESS.logo){ logoEl.src = BUSINESS.logo; logoEl.classList.add('is-visible'); }
        else { logoEl.removeAttribute('src'); logoEl.classList.remove('is-visible'); }

        const bannerWrap = document.getElementById('bizBanner');
        const bannerImg = document.getElementById('bizBannerImg');
        if(BUSINESS.banner){
          bannerImg.src = BUSINESS.banner;
          bannerWrap.classList.add('has-image');
          bannerWrap.classList.remove('is-placeholder');
        } else {
          bannerImg.removeAttribute('src');
          bannerWrap.classList.remove('has-image');
          bannerWrap.classList.add('is-placeholder');
        }

        const badge = document.getElementById('bizOpenBadge');
        badge.style.display = 'inline-flex';
        if(IS_OPEN){
          badge.textContent = 'Disponible';
          badge.className = 'biz-status biz-status-open';
        } else {
          badge.textContent = 'No disponible';
          badge.className = 'biz-status biz-status-closed';
        }

        const addr = document.getElementById('bizAddress');
        if(BUSINESS.address){
          addr.style.display = 'block';
          addr.textContent = '📍 ' + BUSINESS.address;
        } else {
          addr.style.display = 'none';
          addr.textContent = '';
        }

        document.getElementById('closedBanner').style.display = IS_OPEN ? 'none' : 'block';

        const contact = document.getElementById('bizContact');
        contact.textContent = '';
        if(BUSINESS.email) contact.append('✉ ' + BUSINESS.email);
        if(BUSINESS.phone) contact.append((BUSINESS.email ? ' • ' : '') + '📞 ' + BUSINESS.phone);
        loadMenu();
      }catch(e){ document.getElementById('menuList').innerText = 'Error cargando negocio'; }
    }

    async function loadMenu(){
      try{
        const res = await fetch('/api/menu?ownerSlug=' + encodeURIComponent(slug));
        if(!res.ok){ document.getElementById('menuList').innerText = 'Error cargando menú'; return }
        MENU = (await res.json()).filter(m => m.available !== false);
        renderMenu();
        renderCart();
      }catch(e){ document.getElementById('menuList').innerText = 'Error cargando menú'; }
    }

    function renderMenu(){
      const el = document.getElementById('menuList');
      if(!MENU.length){
        el.innerHTML = '<div>No hay productos disponibles aún. El negocio puede agregarlos desde el panel admin.</div>';
        return;
      }
      el.innerHTML = MENU.map(m =>
        `<div class="menu-item"><div><strong>${esc(m.name)}</strong><div class="small">${IS_OPEN ? 'Disponible' : 'Negocio cerrado'}</div></div>` +
        `<div style="display:flex;gap:8px;align-items:center"><div class="menu-price">${fmtMoney(m.price)}</div>` +
        (IS_OPEN
          ? `<button class="add-btn" data-id="${Number(m.id)}">Agregar</button>`
          : `<button class="add-btn" disabled style="opacity:.5;cursor:not-allowed">Cerrado</button>`) +
        `</div></div>`
      ).join('');
      if(!IS_OPEN) return;
      el.querySelectorAll('.add-btn').forEach(b => b.addEventListener('click', ()=>{
        const id = Number(b.getAttribute('data-id'));
        const item = MENU.find(x => x.id === id);
        if(!item) return;
        const existing = CART.find(c => c.id === id);
        if(existing) existing.qty += 1;
        else CART.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
        renderCart();
      }));
    }

    function renderCart(){
      const el = document.getElementById('cartItems');
      const fields = document.getElementById('checkoutFields');
      const wa = document.getElementById('waBtn');
      if(!IS_OPEN){
        el.innerHTML = 'El negocio no está disponible para pedidos.';
        document.getElementById('cartTotal').innerText = '';
        wa.style.display='none';
        fields.style.display='none';
        return;
      }
      if(!CART.length){
        el.innerHTML = 'No hay items en el carrito';
        document.getElementById('cartTotal').innerText = '';
        wa.style.display='none';
        fields.style.display='none';
        return;
      }
      el.innerHTML = '<ul>' + CART.map(c =>
        `<li>${esc(c.name)} x ${esc(c.qty)} — ${fmtMoney(c.price * c.qty)} ` +
        `<button data-id="${Number(c.id)}" class="btn btn-ghost" style="margin-left:8px">-</button></li>`
      ).join('') + '</ul>';
      el.querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', ()=>{
        const id = Number(b.getAttribute('data-id'));
        const idx = CART.findIndex(x => x.id === id);
        if(idx === -1) return;
        CART[idx].qty -= 1;
        if(CART[idx].qty <= 0) CART.splice(idx, 1);
        renderCart();
      }));
      const total = CART.reduce((s,i)=> s + i.qty * i.price, 0);
      document.getElementById('cartTotal').innerText = 'Total: ' + fmtMoney(total);
      fields.style.display='block';
      wa.style.display='inline-block';
      wa.disabled = SENDING;
      wa.textContent = SENDING ? 'Enviando...' : 'Enviar pedido por WhatsApp';
      wa.onclick = () => sendOrderToStoreWhatsApp();
    }

    async function resolveStorePhone(){
      let phone = BUSINESS && BUSINESS.phone;
      if(!normalizeWaPhone(phone)){
        try{
          const cfg = await fetch('/api/config').then(r => r.json());
          phone = cfg.whatsapp_number;
        }catch(e){ /* ignore */ }
      }
      return phone;
    }

    function buildStoreMessage(order, customer, customerPhone, customerAddress, customerNotes, items){
      const bizName = (BUSINESS && BUSINESS.name) || slug || 'tienda';
      const payLabel = order.payment_method === 'transferencia' ? 'Transferencia' : (order.payment_method === 'efectivo' ? 'Efectivo' : '');
      const lines = [
        '🛒 *Nuevo pedido — ' + bizName + '*',
        '',
        'Cliente: ' + customer,
        customerPhone ? ('WhatsApp cliente: ' + customerPhone) : null,
        customerAddress ? ('Dirección: ' + customerAddress) : null,
        payLabel ? ('Método de pago: ' + payLabel) : null,
        customerNotes ? ('Comentarios: ' + customerNotes) : null,
        '',
        '*Detalle:*',
        ...items.map(c => '• ' + c.name + ' x' + c.qty + ' — ' + fmtMoney(c.price * c.qty)),
        '',
        '*Total: ' + fmtMoney(order.total) + '*',
        'Pedido #' + order.id,
        order.checkout_url ? ('Pagar / comprobante: ' + order.checkout_url) : null
      ].filter(Boolean);
      return lines.join('\n');
    }

    async function sendOrderToStoreWhatsApp(){
      const msgEl = document.getElementById('orderMsg');
      const wa = document.getElementById('waBtn');
      msgEl.style.display='none';

      const customer = (document.getElementById('custName').value || '').trim() || 'Cliente';
      const customerPhone = (document.getElementById('custPhone').value || '').trim();
      const paymentMethod = (document.getElementById('payMethod') || {}).value || 'efectivo';
      const customerAddress = (document.getElementById('custAddress').value || '').trim();
      const customerNotes = (document.getElementById('custNotes').value || '').trim();
      if(CART.length === 0){
        msgEl.textContent = 'Agrega productos al carrito primero';
        msgEl.className='small inline-msg error';
        msgEl.style.display='block';
        return;
      }
      if(!customerAddress){
        msgEl.textContent = 'Indica la dirección de entrega';
        msgEl.className='small inline-msg error';
        msgEl.style.display='block';
        document.getElementById('custAddress').focus();
        return;
      }

      let storePhone;
      try{
        storePhone = await resolveStorePhone();
        normalizeWaPhone(storePhone); // validate early
        if(!normalizeWaPhone(storePhone)) throw new Error('sin teléfono');
      }catch(e){
        msgEl.textContent = 'La tienda no tiene WhatsApp configurado. No se puede enviar el pedido.';
        msgEl.className='small inline-msg error';
        msgEl.style.display='block';
        return;
      }

      const items = CART.map(c => ({ id: c.id, name: c.name, price: c.price, qty: c.qty }));
      SENDING = true;
      wa.disabled = true;
      wa.textContent = 'Enviando...';

      try{
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: {'content-type':'application/json'},
          body: JSON.stringify({
            customer_name: customer,
            customer_phone: customerPhone || null,
            customer_address: customerAddress,
            customer_notes: customerNotes || null,
            payment_method: paymentMethod,
            items,
            ownerSlug: slug
          })
        });
        if(!res.ok){
          const t = await res.json().catch(()=>({}));
          throw new Error(t.error || res.statusText);
        }
        const order = await res.json();
        const message = buildStoreMessage(order, customer, customerPhone, customerAddress, customerNotes, items);
        openWhatsAppToStore(storePhone, message);

        msgEl.textContent = 'Pedido #' + order.id + ' creado. Se abrió WhatsApp para enviarlo a la tienda.';
        msgEl.className='small inline-msg success';
        msgEl.style.display='block';
        CART = [];
        document.getElementById('custName').value = '';
        document.getElementById('custPhone').value = '';
        document.getElementById('custAddress').value = '';
        document.getElementById('custNotes').value = '';
        const payEl = document.getElementById('payMethod'); if(payEl) payEl.value = 'efectivo';
        renderCart();
      }catch(e){
        msgEl.textContent = 'No se pudo enviar: ' + e.message;
        msgEl.className='small inline-msg error';
        msgEl.style.display='block';
      }finally{
        SENDING = false;
        renderCart();
      }
    }

    if(!slug) document.getElementById('menuList').innerText = 'Negocio no especificado (url debe ser /b/:slug)';
    else loadBusiness();
  </script>
  <script src="/theme.js"></script>
</body>
</html>
