<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - Nequi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="card">
    <h1>tiagPOS - Pago por Nequi</h1>
    <div id="info">Cargando...</div>
    <div style="margin-top:14px">
      <a id="back" href="/" style="margin-right:8px">← Volver al menú</a>
      <a id="waLink" class="button" target="_blank" rel="noopener">Enviar comprobante por WhatsApp</a>
    </div>
  </div>

  <script>
    function fmtMoney(n){ return '$' + (n).toLocaleString('es-CO'); }
    const params = new URLSearchParams(location.search);
    const orderId = params.get('orderId');
    const total = params.get('total');

    // Nequi number provided by the restaurant
    const NEQUI_NUMBER = '573242281300'; // country code + number without +

    function buildWaMsg(){
      return encodeURIComponent(`Hola, adjunto comprobante de pago para el pedido #${orderId}. Total: ${fmtMoney(total)}. Gracias.`);
    }

    const info = document.getElementById('info');
    const waLink = document.getElementById('waLink');

    if(!orderId || !total){
      info.innerHTML = '<p>No se recibieron parámetros de orden. Vuelve al menú y crea un pedido primero.</p>';
      waLink.style.display = 'none';
    } else {
      info.innerHTML = `<p>Pedido ID: <strong>#${orderId}</strong></p>
        <p>Total a pagar: <strong>${fmtMoney(Number(total))}</strong></p>
        <h3>Instrucciones de pago (Nequi)</h3>
        <ol>
          <li>Abre tu app Nequi.</li>
          <li>Envía el total al número: <strong>+${NEQUI_NUMBER}</strong>.</li>
          <li>Toma una foto o captura de pantalla del comprobante.</li>
          <li>Pulsa "Enviar comprobante por WhatsApp" y adjunta la imagen en el chat con el restaurante.</li>
        </ol>
        <p>Si tienes problemas, contacta al restaurante por WhatsApp.</p>`;

      const waUrl = `https://wa.me/${NEQUI_NUMBER}?text=${buildWaMsg()}`;
      waLink.href = waUrl;
      waLink.textContent = 'Enviar comprobante por WhatsApp';

      // add confirm payment UI
      const confirmDiv = document.createElement('div');
      confirmDiv.style.marginTop = '12px';
      confirmDiv.innerHTML = `
        <p style="margin:8px 0">Si ya enviaste el comprobante por WhatsApp, puedes marcar el pedido como pagado aquí (opcionalmente añade la URL del comprobante):</p>
        <input id="proof" placeholder="URL del comprobante (opcional)" style="width:100%;padding:8px;border-radius:6px;border:1px solid #ddd;margin-bottom:8px" />
        <div style="display:flex;gap:8px"><button id="markPaid">Marcar como pagado</button><span id="confirmMsg" style="align-self:center;color:green"></span></div>
      `;
      document.querySelector('.card').appendChild(confirmDiv);

      document.getElementById('markPaid').addEventListener('click', async ()=>{
        const proof = document.getElementById('proof').value.trim();
        try{
          const res = await fetch(`/api/orders/${orderId}/proof`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ proof_url: proof || null })});
          if(!res.ok) throw new Error('Error en la solicitud');
          const data = await res.json();
          document.getElementById('confirmMsg').textContent = 'Comprobante enviado. El restaurante puede validar el pedido.';
        }catch(err){
          alert('No se pudo enviar el comprobante.');
        }
      });
    }
    </script>
</body>
</html>
