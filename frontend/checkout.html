<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Checkout - Nequi</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var t=localStorage.getItem('tiagpos-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="checkout-body">
  <div class="checkout-wrap">
    <div class="checkout-theme">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Cambiar tema">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <div class="card checkout-card">
      <h1>WhatsMenú — Pago por Nequi</h1>
      <div id="info">Cargando...</div>

      <div id="checkoutActions" class="checkout-actions" style="display:none">
        <a id="back" class="btn btn-ghost" href="/">← Volver al menú</a>
        <a id="waLink" class="btn btn-primary" target="_blank" rel="noopener">Enviar comprobante por WhatsApp</a>
      </div>

      <div id="proofBox" class="checkout-proof" style="display:none">
        <p class="small">Opcional: si ya tienes el comprobante en un enlace, regístralo aquí para que el restaurante lo vea en su panel.</p>
        <input id="proof" placeholder="URL del comprobante (opcional)" />
        <div class="checkout-proof-row">
          <button id="markPaid" class="btn btn-ghost" type="button">Registrar URL</button>
          <span id="confirmMsg" class="small inline-msg" style="display:none"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="/theme.js"></script>
  <script>
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fmtMoney(n){ return '$' + Number(n).toLocaleString('es-CO'); }

    const params = new URLSearchParams(location.search);
    const orderId = params.get('orderId');
    const total = params.get('total');
    const token = params.get('token') || '';
    const NEQUI_E164 = '573242281300';

    function localPhoneDigits(e164){
      let d = String(e164 || '').replace(/\D/g, '');
      if(d.startsWith('57') && d.length > 10) d = d.slice(2);
      return d;
    }

    function buildWaMsg(){
      return encodeURIComponent('Hola, adjunto comprobante de pago para el pedido #' + orderId + '. Total: ' + fmtMoney(total) + '. Gracias.');
    }

    async function copyText(text){
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(text);
          return true;
        }
      }catch(e){}
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      }catch(e){
        return false;
      }
    }

    const info = document.getElementById('info');
    const waLink = document.getElementById('waLink');
    const actions = document.getElementById('checkoutActions');
    const proofBox = document.getElementById('proofBox');
    const localPhone = localPhoneDigits(NEQUI_E164);

    if(!orderId || !total){
      info.textContent = 'No se recibieron parámetros de orden. Vuelve al menú y crea un pedido primero.';
      actions.style.display = 'none';
      proofBox.style.display = 'none';
    } else {
      info.innerHTML = `
        <p>Pedido ID: <strong>#${esc(orderId)}</strong></p>
        <p>Total a pagar: <strong>${esc(fmtMoney(Number(total)))}</strong></p>
        <h3>Instrucciones de pago (Nequi)</h3>
        <ol class="checkout-steps">
          <li>Abre tu app Nequi.</li>
          <li>
            Envía el total al número:
            <span class="checkout-phone-row">
              <strong id="nequiDisplay">+${esc(NEQUI_E164)}</strong>
              <button type="button" id="copyPhoneBtn" class="btn btn-ghost checkout-copy-btn">Copiar para Nequi</button>
            </span>
            <span class="small checkout-copy-hint">Se copia <strong>${esc(localPhone)}</strong> (sin +57) para pegarlo en la app.</span>
            <span id="copyMsg" class="small inline-msg" style="display:none;margin-top:6px"></span>
          </li>
          <li>Toma una foto o captura de pantalla del comprobante.</li>
          <li>Pulsa el botón de abajo y adjunta la imagen en el chat de WhatsApp.</li>
        </ol>
        <p class="small">Si tienes problemas, contacta al restaurante por WhatsApp.</p>`;

      actions.style.display = 'flex';
      proofBox.style.display = 'block';
      document.getElementById('back').href = document.referrer || '/';

      waLink.href = 'https://wa.me/' + NEQUI_E164 + '?text=' + buildWaMsg();

      document.getElementById('copyPhoneBtn').addEventListener('click', async ()=>{
        const msg = document.getElementById('copyMsg');
        const ok = await copyText(localPhone);
        msg.style.display = 'block';
        if(ok){
          msg.className = 'small inline-msg success';
          msg.textContent = 'Número copiado: ' + localPhone;
        } else {
          msg.className = 'small inline-msg error';
          msg.textContent = 'No se pudo copiar. Copia manualmente: ' + localPhone;
        }
      });

      document.getElementById('markPaid').addEventListener('click', async ()=>{
        const proof = document.getElementById('proof').value.trim();
        const msg = document.getElementById('confirmMsg');
        msg.style.display = 'none';
        try{
          const res = await fetch('/api/orders/' + encodeURIComponent(orderId) + '/proof', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ proof_url: proof || null, token })
          });
          if(!res.ok) throw new Error('Error en la solicitud');
          msg.style.display = 'block';
          msg.className = 'small inline-msg success';
          msg.textContent = 'URL registrada. El restaurante validará el pedido.';
        }catch(err){
          msg.style.display = 'block';
          msg.className = 'small inline-msg error';
          msg.textContent = 'No se pudo registrar. Usa el link de checkout del pedido.';
        }
      });
    }
  </script>
</body>
</html>
